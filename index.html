<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Letter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MUSIC -->
    <audio id="bgMusic" loop>
        <source src="zach.mp3" type="audio/mpeg">
    </audio>

    <div class="container">

        <!-- COVER PAGE -->
        <div id="coverPage">
            <h3>Hello! I know this isn't much, but I just want to show my appreciation for you <br> 
            with this simple thing, hope you like it:) </h3>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

            <button onclick="checkPassword()">
                Unlock
            </button>

            <p id="errorMessage"></p>
        </div>

        <!-- LETTER PAGE -->
        <div id="letterPage" class="hidden">

            <img src="zach1.png" class="floating left">
            <img src="zach1.png" class="floating right">

            <div class="letter-box">

                  <!-- SCRAPBOOK PHOTO COLLAGE -->
<div class="photo-collage">

    <img src="zachzach.jpg" class="scrap-photo p1">
    <img src="zachzach2.jpg" class="scrap-photo p2">
    <img src="zachzach3.jpg" class="scrap-photo p3">

</div>
                <h2>★ Zaczac ★</h2>

                <p>
                    Hi! This is your secret message.<br><br>

                    Replace this with your actual letter later.<br>
                    You can make it long, emotional, funny, anything you want.<br><br>

                    — From your friend 💌
                </p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
