<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Letter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MUSIC -->
    <audio id="bgMusic" loop>
        <source src="zach.mp3" type="audio/mpeg">
    </audio>

    <div class="container">

        <!-- COVER PAGE -->
        <div id="coverPage">
            <h1>(insert here)</h1>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

            <button onclick="checkPassword()">
                Unlock
            </button>

            <p id="errorMessage"></p>
        </div>

        <!-- LETTER PAGE -->
        <div id="letterPage" class="hidden">

            <img src="zach1.png" class="floating left">
            <img src="zach1.png" class="floating right">

            <div class="letter-box">

                   <!-- PHOTO -->
        <img src="zachzach.jpg" class="memory-photo" alt="Us together">
                
                <h2>Your Letter</h2>

                <p>
                    Hi! This is your secret message.<br><br>

                    Replace this with your actual letter later.<br>
                    You can make it long, emotional, funny, anything you want.<br><br>

                    — From your friend 💌
                </p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
