<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Letter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Cover Page -->
        <div id="coverPage">
            <h1>(insert here)</h1>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

            <button onclick="checkPassword()">
                Unlock
            </button>

            <p id="errorMessage"></p>
        </div>

        <!-- Hidden Letter -->
        <div id="letterPage" class="hidden">
            <h2>Your Letter</h2>
            <p>
                Hi! This is your secret message.
                You can replace this with your actual letter later.
            </p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
